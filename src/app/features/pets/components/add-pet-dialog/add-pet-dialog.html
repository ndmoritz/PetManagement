<h2 mat-dialog-title>Tier hinzufügen</h2>

<mat-dialog-content>

    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Geburtsdatum</mat-label>
        <input matInput>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Farbe</mat-label>
        <input matInput>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Geschlecht</mat-label>
        <input matInput>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Rasse</mat-label>
        <input matInput>
    </mat-form-field>
    
    <mat-form-field appearance="outline">
        <mat-label>Chipnummer</mat-label>
        <input matInput>
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">
        Abbrechen
    </button>

    <button mat-flat-button (click)="save()">
        Speichern
    </button>
</mat-dialog-actions>
